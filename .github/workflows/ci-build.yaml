name: CI Build Vooz Peer Server

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  packages: write

jobs:
  test-and-lint:
    name: CI Test & Lint Vooz Peer Server
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_HOST: localhost
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      # - name: Run Format Check
      #   run: npm run format:check
      - name: Run Lint
        run: npm run lint
      - run: npm run build
      - name: Run Tests & Coverage
        run: npm run coverage

  docker-push:
    needs: test-and-lint
    name: CI Build & Push Vooz Peer Server
    # Only push to registry on main branch merges/pushes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calculate Version & Sync package.json
        id: versioning
        run: |
          # Generate version based on YYYY.MM.DD.RunNumber
          NEW_VERSION=$(date +'%Y.%m.%d').${{ github.run_number }}
          echo "VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT

          # Update version field in package.json using jq
          jq ".version = \"$NEW_VERSION\"" package.json > package.json.tmp && mv package.json.tmp package.json
          echo "Updated package.json to $NEW_VERSION"

      - name: Commit & Push Version Bump
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          # [skip ci] is CRITICAL to prevent an infinite loop of builds
          git commit -m "chore: bump version to ${{ steps.versioning.outputs.VERSION }} [skip ci]"
          git push origin main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.versioning.outputs.VERSION }}
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Create Git Tag
        run: |
          git tag ${{ steps.versioning.outputs.VERSION }}
          git push origin ${{ steps.versioning.outputs.VERSION }}
